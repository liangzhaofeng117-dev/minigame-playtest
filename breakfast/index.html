<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>街角早餐铺 · 浏览器测试模式</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e8962e'/%3E%3Cellipse cx='16' cy='19' rx='10' ry='4' fill='%23fbe3ad'/%3E%3Cellipse cx='16' cy='14' rx='10' ry='4' fill='%23f7d488'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f6efe3;
        /* 通过隐藏探针元素读取安全区 insets，交给 BrowserAdapter */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      #safe-probe {
        position: fixed;
        top: var(--safe-top);
        right: var(--safe-right);
        bottom: var(--safe-bottom);
        left: var(--safe-left);
        width: 0;
        height: 0;
        pointer-events: none;
        visibility: hidden;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
    <script type="module" crossorigin src="/minigame-playtest/assets/index-BUacEQAP.js"></script>
  </head>
  <body>
    <div id="safe-probe"></div>
    <canvas id="game"></canvas>
  </body>
</html>
